<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOAP Agent · voice intake</title>
  <style>
    :root { --bg:#f4f6f5; --ink:#1c2a24; --muted:#5f6f67; --line:#d5ddd8; --ok:#15803d; --warn:#b45309; --teal:#0d7a6e; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); font-size: .9rem; margin: 0 0 1rem; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:1rem; margin-bottom:1rem; }
    #status { font-size:.9rem; color:var(--muted); min-height:1.2rem; }
    #log { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.55rem; max-height:22rem; overflow:auto; }
    #log li { padding:.55rem .7rem; border-radius:10px; line-height:1.4; }
    #log .user { background:#e7f3f1; align-self:flex-end; max-width:85%; }
    #log .assistant { background:#f3f4f3; align-self:flex-start; max-width:90%; }
    button { margin-top:.75rem; padding:.7rem 1.1rem; border:0; border-radius:8px; background:var(--teal); color:#fff; font-weight:600; cursor:pointer; }
    button[aria-pressed="true"] { background:#b45309; }
    button:disabled { opacity:.55; cursor:wait; }
    .strip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem;
      border: 1px dashed var(--line); border-radius: 10px; padding: .75rem .9rem; background: #fff; white-space: pre-wrap; }
    .ok { color: var(--ok); font-weight: 700; } .no { color: var(--warn); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>SOAP Agent</h1>
    <p class="sub">Herbenzo voice intake on Gemini Live. This page does not diagnose or prescribe. If this is an emergency, contact local emergency services.</p>
    <section class="panel" aria-label="Voice intake">
      <div id="status" role="status">Connecting…</div>
      <ol id="log"></ol>
      <button type="button" id="talk" aria-pressed="false" disabled>Tap to talk</button>
    </section>
    <h2 style="font-size:1rem;margin:0 0 .4rem;">Handoff readiness</h2>
    <div id="strip" class="strip" role="status">Loading /ready…</div>
    <button type="button" id="refresh">Refresh</button>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const talkBtn = document.getElementById('talk');
    let ws, audioCtx, recording = false, processor, source, micStream;
    const capture = [];
    let playAt = 0;
    let busy = false;

    function say(role, text) {
      if (!text) return;
      const li = document.createElement('li');
      li.className = role;
      li.textContent = text;
      logEl.appendChild(li);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text) { statusEl.textContent = text; }

    function wsUrl() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const token = new URLSearchParams(location.search).get('token');
      const q = token ? ('?token=' + encodeURIComponent(token)) : '';
      return proto + '://' + location.host + '/v1/voice/live' + q;
    }

    function connect() {
      ws = new WebSocket(wsUrl());
      ws.onopen = () => setStatus('Connected. Waiting for the greeting.');
      ws.onclose = () => { setStatus('Disconnected.'); talkBtn.disabled = true; };
      ws.onerror = () => setStatus('Could not open the voice connection.');
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'session') setStatus('Session ' + msg.session_id.slice(0, 8) + ' · ' + msg.model);
        if (msg.type === 'user') say('user', msg.text);
        if (msg.type === 'assistant') { say('assistant', msg.text); setStatus('Speaking…'); busy = true; talkBtn.disabled = true; }
        if (msg.type === 'audio') playPcm(msg.pcm_base64, msg.sample_rate || 24000);
        if (msg.type === 'turn_done') { busy = false; talkBtn.disabled = false; setStatus(recording ? 'Listening… tap again to send.' : 'Tap to talk.'); }
        if (msg.type === 'error') { setStatus(msg.detail); busy = false; talkBtn.disabled = false; }
      };
    }

    function playPcm(b64, rate) {
      if (!audioCtx) return;
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const view = new DataView(bytes.buffer);
      const samples = Math.floor(bytes.byteLength / 2);
      const audio = new Float32Array(samples);
      for (let i = 0; i < samples; i++) audio[i] = view.getInt16(i * 2, true) / 32768;
      const buf = audioCtx.createBuffer(1, samples, rate);
      buf.copyToChannel(audio, 0);
      const node = audioCtx.createBufferSource();
      node.buffer = buf;
      node.connect(audioCtx.destination);
      const start = Math.max(audioCtx.currentTime + 0.05, playAt);
      node.start(start);
      playAt = start + buf.duration;
    }

    function downsample(input, inRate, outRate) {
      if (inRate === outRate) return input;
      const ratio = inRate / outRate;
      const length = Math.floor(input.length / ratio);
      const out = new Float32Array(length);
      for (let i = 0; i < length; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(input.length, Math.floor((i + 1) * ratio));
        let sum = 0, n = 0;
        for (let j = start; j < end; j++) { sum += input[j]; n++; }
        out[i] = n ? sum / n : 0;
      }
      return out;
    }

    function concatFloat(chunks) {
      const length = chunks.reduce((n, c) => n + c.length, 0);
      const out = new Float32Array(length);
      let offset = 0;
      for (const chunk of chunks) { out.set(chunk, offset); offset += chunk.length; }
      return out;
    }

    function floatToPcm16(samples) {
      const buf = new ArrayBuffer(samples.length * 2);
      const view = new DataView(buf);
      for (let i = 0; i < samples.length; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      const bytes = new Uint8Array(buf);
      let binary = '';
      const step = 0x8000;
      for (let i = 0; i < bytes.length; i += step) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
      }
      return btoa(binary);
    }

    async function ensureMic() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        return;
      }
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true } });
      audioCtx = new AudioContext();
      source = audioCtx.createMediaStreamSource(micStream);
      processor = audioCtx.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = (event) => {
        if (!recording) return;
        capture.push(new Float32Array(event.inputBuffer.getChannelData(0)));
      };
      source.connect(processor);
      processor.connect(audioCtx.destination);
    }

    async function toggleTalk() {
      if (busy || !ws || ws.readyState !== WebSocket.OPEN) return;
      if (!recording) {
        try { await ensureMic(); }
        catch (err) { setStatus('Microphone permission is required. ' + err); return; }
        capture.length = 0;
        recording = true;
        talkBtn.setAttribute('aria-pressed', 'true');
        talkBtn.textContent = 'Tap to send';
        setStatus('Listening… tap again to send.');
        return;
      }
      recording = false;
      talkBtn.setAttribute('aria-pressed', 'false');
      talkBtn.textContent = 'Tap to talk';
      talkBtn.disabled = true;
      setStatus('Sending…');
      const pcm = downsample(concatFloat(capture), audioCtx.sampleRate, 16000);
      capture.length = 0;
      ws.send(JSON.stringify({ type: 'utterance', pcm_base64: floatToPcm16(pcm) }));
    }

    talkBtn.addEventListener('click', toggleTalk);
    connect();
    talkBtn.disabled = false;

    async function load() {
      const el = document.getElementById('strip');
      try {
        const r = await fetch('/ready');
        const j = await r.json();
        const checks = j.checks || {};
        const rec = checks.recommender || {};
        const handoffOk = rec.ok === true;
        const readyCls = j.ready ? 'ok' : 'no';
        const aCls = handoffOk ? 'ok' : 'no';
        el.innerHTML =
          `Handoff · <span class="${readyCls}">F ready=${j.ready}</span>` +
          ` · mode=${j.mode || '?'}` +
          ` · <span class="${aCls}">→A ${handoffOk ? 'reachable' : 'down'}</span>` +
          `\nProvenance: starts on SymptomSpec handoff (spec_id → stages=[F])` +
          `\nrecommender: ${rec.detail || rec.url || '—'}` +
          `\nHTTP ${r.status}`;
      } catch (e) {
        el.textContent = 'Error: ' + e + ' — is the agent on :8081?';
      }
    }
    document.getElementById('refresh').onclick = load;
    load();
  </script>
</body>
</html>
