[project]
name = "herbenzo-agent"
version = "0.1.0"
description = "Herbenzo Stage F intake agent: emits validated SymptomSpec for the Recommender"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "bleach>=6.4.0",
    "fastapi>=0.141.1",
    "google-genai>=3.6.0",
    "httpx>=0.28.1",
    "herbenzo-contracts>=0.1.1",
    "langchain-core>=1.6.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv.sources]
# Portable source for a fresh machine. The repo is private: uv sync needs GitHub access
# (SSH, or a credential that can read shivasaimomula-ux/herbenzo-contracts).
# Optional local checkout — replace the git line, do not commit an absolute path.
# From this directory, a clone that sits next to the SOAP-AGENT repo is:
#   herbenzo-contracts = { path = "../../../herbenzo-contracts", editable = true }
herbenzo-contracts = { git = "https://github.com/shivasaimomula-ux/herbenzo-contracts.git", rev = "33205e758ef89986551a13b1e7aecbf97e5136ef" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.7",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["herbenzo_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: calls real LLM / network APIs (skipped unless HERBENZO_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP046", "B008"]  # UP046: pydantic generic models keep the Generic[T] form
